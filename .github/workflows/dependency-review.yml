# Dependency review on every pull request: blocks PRs that add dependencies (npm or GitHub Actions)
# with known vulnerabilities. Free for public repositories.
# Actions are pinned to full commit SHAs (version and release date in the comment).
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0 (2026-05-08)
        with:
          fail-on-severity: moderate
          # Comment summaries need pull-requests: write; kept off for least privilege.
          comment-summary-in-pr: never
