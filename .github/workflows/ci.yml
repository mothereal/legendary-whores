# CI: engine tests, the bot-simulation balance gate, and the public-repo privacy scan.
# Paths assume the proposed layout (engine/test.mjs, engine/sim.mjs, scripts/scan-public.mjs).
# No package.json and no dependencies: plain Node, nothing installed.
#
# BALANCE GATE STATUS (2026-10-07, v2): green. The full run of engine/sim.mjs ends
#   ALL TARGETS: MET (none failing)  [252 s]
# and T11 ("Kinks are earned") passes: casual-tap vs the better planner's Kink hits per evening,
#   dolly 0.10 vs 0.24 (casual 0.09), fanny 0.01 vs 0.29 (casual 0.00), jackie 0.01 vs 0.29 (casual 0.00) -> PASS
# The T11b line is informational (the rejected every-evening Kink offer); it prints FAIL by design
# and is not part of the gate. The job is deliberately binding (no continue-on-error):
# an increment ships only when the gate passes, or when the designer changes the target band in
# rules-core.md / sim.mjs on purpose, in a reviewed commit.
#
# Actions are pinned to full commit SHAs (version and release date in the comment) and were at
# least 7 days old when pinned. Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: '24'
      - name: Run engine tests
        run: node engine/test.mjs
      # The first evening's Curtain (lever 1, the solo salt): the script exits non-zero when a starter's scripted first
      # evening no longer reaches Curtain 0 the way How to play promises. Binding: a check that never binds is a finding.
      - name: First Curtain gate
        run: node game/find-first-curtain.mjs
      - name: Run the sign-up name tests (format, length, no repeat on a reroll, banned words)
        run: node game/names.test.mjs

  # The world server: migration, backups, the journal and its replay, the routes over HTTP, the bot swarm
  # (server/test/*.test.mjs, node:test, zero dependencies, under 60 s). Node 22 is what the live host runs; 24 is current.
  # The glob is quoted so Node expands it itself (node --test takes file patterns, not a directory).
  server-tests:
    name: server tests (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: ${{ matrix.node }}
      - name: Run the server tests
        env:
          TZ: UTC
        run: node --test 'server/test/*.test.mjs'

  balance-gate:
    name: bot-sim balance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: '24'
      - name: Bot simulation (quick on pull requests, full on main)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node engine/sim.mjs --quick | tee sim-report.txt
          else
            node engine/sim.mjs | tee sim-report.txt
          fi
      - name: Keep the simulation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: sim-report
          path: sim-report.txt
          retention-days: 14
          if-no-files-found: ignore

  public-scan:
    name: public-repo privacy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history; PR head, not GitHub's synthetic merge commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: '24'
      - name: Scan files and history
        shell: bash
        env:
          # Optional repository secret holding a private deny-list (newline- or comma-separated).
          # This project keeps its deny-list OFF GitHub on purpose: it is enforced by the local
          # pre-commit and pre-push hooks before anything is pushed. CI runs every other check
          # (keys, tokens, emails, home paths, IPs, identities) on every push and pull request.
          SCAN_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
        run: |
          set -euo pipefail
          extra=""
          if [ -z "${SCAN_DENYLIST:-}" ]; then
            echo "::notice::No deny-list in CI (kept local by design); running the generic secret and identity scan."
            extra="--allow-missing-denylist"
          fi
          node scripts/scan-public.mjs --all --history $extra
