# OWASP ZAP baseline scan of the LIVE site (passive: spiders and inspects responses, no attacks).
# The real attack surface is the server, not this repo. Report-only: it never fails the run and
# never opens issues; download the "zap-baseline-report" artifact from the run page.
# Run it only against legendarywhores.com (a site we own). If Cloudflare's bot protection
# challenges the GitHub runner, the report will show challenge pages; add a WAF skip rule for
# the scanner's user agent only if you want deeper coverage.
# Actions are pinned to full commit SHAs (version and release date in the comment).
name: ZAP baseline (live site)

on:
  schedule:
    - cron: '13 6 * * 3' # Wednesdays 06:13 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline
  cancel-in-progress: false

jobs:
  zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (for an optional .zap/rules.tsv)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0 (2025-10-24)
        with:
          target: https://legendarywhores.com
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
          cmd_options: '-a -j'
