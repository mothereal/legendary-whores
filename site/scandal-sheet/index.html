<body>

<div class="desk">
<div class="sheet press">

<header class="mast press-mast">
  <h1 class="nameplate">The Scandal Sheet</h1>
  <p class="folio">
    <span class="folio-mid">The newspaper of the Eternal District</span>
    <span class="folio-eras">London<i> 1895</i> · Dakota<i> 1876</i> · Las Vegas<i>, tonight</i></span>
  </p>
</header>

<main class="press-main" id="main">
  <p class="kicker"><span class="kicker-tag">Stop press</span></p>

  <div class="press-grid">
    <div class="clip clip--ww">
      <figure>
        <figcaption class="clip-src"><span class="clip-paper">The Lower Bottoms Bugle</span> <span class="clip-date">Dakota Territory, 1876</span></figcaption>
        <blockquote class="clip-q"><p>A goat at Hog Ranch Row has been elected sheriff. Turnout was low.</p></blockquote>
      </figure>
    </div>

    <figure class="press-shot">
      <img src="../landing/assets/plan-screen.jpg" width="390" height="693" alt="The plan screen: three cards picked for tonight’s gentleman, with Best Guess and Seal it.">
      <figcaption>Tonight’s plan. Pick up to three cards, then seal it.</figcaption>
    </figure>

    <div class="stamp-wrap">
      <a class="stamp" href="/game/" id="hero-cta">
        <span class="stamp-top">Free</span>
        <span class="stamp-main">Play now</span>
        <span class="stamp-bot">in your browser</span>
      </a>
      <p class="stamp-note">No download. Works on your phone. Adults only.</p>
    </div>
  </div>
</main>

<footer class="foot press-foot">
  <p class="foot-small">The Scandal Sheet is the paper in <a href="/">Legendary Whores</a>, a free comedy strategy game.</p>
</footer>

</div>
</div>
</body>
