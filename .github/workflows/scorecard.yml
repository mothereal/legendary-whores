# OpenSSF Scorecard: weekly supply-chain posture check, results in the Security tab.
# Follows the upstream example (ossf/scorecard-action v2.4.4). Scorecard's publish step requires
# this workflow to keep read-only defaults and only the steps below, so do not add steps here.
# Actions are pinned to full commit SHAs (version and release date in the comment).
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 2' # Tuesdays 05:41 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API (needed for the badge)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4 (2026-07-23)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2 (2026-09-24)
        with:
          sarif_file: results.sarif
